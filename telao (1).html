<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Telão — ECIT 10 anos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700;9..144,900&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* Telão do dia de visita. Abra em tela cheia no projetor ou na TV (tecla F). */
:root{--marinho:#16233F;--marinho-esc:#0C1529;--ouro:#E0A92F;--verde:#2FA35B;--azul:#2F62B8;
  --disp:'Fraunces',Georgia,serif;--corpo:'DM Sans',system-ui,sans-serif}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:radial-gradient(90% 90% at 20% 0%,#2B4378 0%,var(--marinho) 45%,var(--marinho-esc) 100%);color:#fff;font-family:var(--corpo);overflow:hidden}
.tela{height:100vh;display:grid;grid-template-columns:1.7fr 1fr;gap:3vw;padding:3.2vw 3.6vw}
.topo{grid-column:1/-1;display:flex;align-items:center;gap:1.2vw}
.topo img{width:5.2vw;min-width:48px;border-radius:50%;background:#fff;box-shadow:0 0 0 .25vw var(--ouro)}
.topo h1{font-family:var(--disp);font-size:2.4vw;margin:0}
.topo p{margin:0;font-size:1.25vw;color:rgba(255,255,255,.75)}
.palco{display:grid;place-items:center;min-height:0}
.frase{width:100%;text-align:center;transition:opacity .6s,transform .6s}
.frase.sai{opacity:0;transform:translateY(2vh)}
.frase .av{width:11vw;height:11vw;max-width:150px;max-height:150px;border-radius:50%;display:grid;place-items:center;font-size:5.2vw;margin:0 auto 2.4vh;box-shadow:0 0 0 .5vw rgba(255,255,255,.15)}
.frase q{display:block;font-family:var(--disp);font-weight:700;font-size:3.7vw;line-height:1.22;quotes:"“" "”"}
.frase q b{color:var(--ouro)}
.frase .quem{margin-top:3vh;font-size:1.9vw;font-weight:700}
.frase .quem span{font-weight:400;color:rgba(255,255,255,.75)}
.novo{display:inline-block;background:var(--ouro);color:#2A1D00;font-weight:700;font-size:1.2vw;padding:.4vw 1.2vw;border-radius:99px;margin-bottom:2vh}
.vazio{font-size:2vw;color:rgba(255,255,255,.7);text-align:center}
.lado{display:flex;flex-direction:column;gap:2.2vh;min-height:0}
.painel{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);border-radius:1.4vw;padding:1.6vw 1.8vw}
.painel h2{font-family:var(--disp);font-size:1.7vw;margin:0}
.numeros{display:flex;gap:2.4vw;margin-top:1vh}
.numeros div{font-size:1.1vw;color:rgba(255,255,255,.7)}
.numeros b{display:block;font-family:var(--disp);font-size:3.2vw;color:var(--ouro);line-height:1}
.barra{display:grid;grid-template-columns:9vw 1fr 2.4vw;gap:.8vw;align-items:center;margin-top:1.5vh;font-size:1.3vw}
.barra .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.barra .fio{height:1.1vw;border-radius:99px;background:rgba(255,255,255,.12);overflow:hidden}
.barra .fio i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--verde),var(--ouro));transition:width 1s}
.barra .n{text-align:right;font-weight:700}
.qr{display:flex;gap:1.4vw;align-items:center;margin-top:auto}
.qr .caixa{background:#fff;border-radius:.8vw;padding:.7vw;width:10vw;height:10vw;display:grid;place-items:center;color:#16233F;font-size:.9vw;text-align:center;word-break:break-all;flex:none}
.qr .caixa canvas,.qr .caixa img{width:100%!important;height:auto!important}
.qr p{margin:0;font-size:1.4vw;line-height:1.35}
.qr p b{display:block;font-family:var(--disp);font-size:1.9vw;color:var(--ouro)}
.fs{position:fixed;right:1vw;bottom:1vw;background:rgba(255,255,255,.14);color:#fff;border:0;border-radius:99px;padding:.6vw 1.2vw;font:inherit;cursor:pointer;font-size:max(13px,1vw)}
.fs:hover{background:rgba(255,255,255,.25)}
@media(max-width:800px){body{overflow:auto}.tela{display:block;height:auto;padding:20px}.topo h1{font-size:22px}.topo p{font-size:14px}.topo img{width:48px}
  .frase q{font-size:26px}.frase .quem{font-size:16px}.frase .av{width:90px;height:90px;font-size:44px}.painel h2{font-size:18px}.numeros b{font-size:32px}.numeros div,.barra{font-size:14px}
  .barra{grid-template-columns:90px 1fr 28px}.barra .fio{height:10px}.qr .caixa{width:110px;height:110px;font-size:10px}.qr p{font-size:14px}.qr p b{font-size:18px}.novo{font-size:13px}.lado{margin-top:24px}.palco{padding:30px 0}.topo{margin-bottom:10px}}
@media(prefers-reduced-motion:reduce){.frase,.barra .fio i{transition:none}}
</style>
</head>

  try{ firebase.initializeApp(FIREBASE_CONFIG); DB = firebase.firestore(); }catch(e){ console.error('Firebase não iniciou:', e); }
}

const T = { lista: [], idx: 0, vistos: null, fila: [], timer: null };

function mostra(r, novo){
  const a = AVATARES[r.avatar] || AVATARES[0];
  const el = document.createElement('div');
  el.className = 'frase sai';
  el.innerHTML = (novo ? '<div class="novo">Acabou de chegar!</div>' : '')+
    '<div class="av" style="background:'+a[0]+'">'+a[1]+'</div>'+
    '<q><b>'+esc(r.inicio)+'</b> '+esc(r.texto)+'</q>'+
    '<div class="quem">'+esc(r.nome)+' <span>· '+esc(bonito(r.cidade))+'</span></div>';
  const palco = $('#palco'); palco.innerHTML = ''; palco.appendChild(el);
  requestAnimationFrame(() => requestAnimationFrame(() => el.classList.remove('sai')));
}
function proxima(){
  if(!T.lista.length){ $('#palco').innerHTML = '<div class="vazio">Aguardando as primeiras frases…</div>'; return; }
  if(T.fila.length){ mostra(T.fila.shift(), true); return; }
  mostra(T.lista[T.idx % T.lista.length], false); T.idx++;
}
function ranking(){
  const m = {};
  T.lista.forEach(r => { const k = normaliza(r.cidade); if(k) (m[k] = m[k] || {nome:bonito(r.cidade), n:0}).n++; });
  const rk = Object.values(m).sort((a,b) => b.n - a.n || a.nome.localeCompare(b.nome,'pt-BR'));
  const max = rk.length ? rk[0].n : 1;
  $('#n-frases').textContent = T.lista.length; $('#n-cidades').textContent = rk.length;
  $('#ranking').innerHTML = rk.slice(0,6).map(c =>
    '<div class="barra"><span class="nm">'+esc(c.nome)+'</span><span class="fio"><i style="width:'+Math.round(c.n/max*100)+'%"></i></span><span class="n">'+c.n+'</span></div>').join('')
    || '<div class="barra" style="display:block;color:rgba(255,255,255,.7)">Aparece quando chegarem as primeiras frases.</div>';
}
function recebe(lista){
  lista.sort((a,b) => (b.criadoEm||0) - (a.criadoEm||0));
  if(T.vistos === null){ T.vistos = new Set(lista.map(r => r.id)); }
  else lista.forEach(r => { if(!T.vistos.has(r.id)){ T.vistos.add(r.id); T.fila.push(r); } });
  const eraVazio = !T.lista.length; T.lista = lista; ranking();
  if(eraVazio && lista.length) proxima();
  else if(T.fila.length && T.lista.length) { /* a frase nova entra na próxima troca */ }
}
function iniciar(){
  if(DB){
    DB.collection('recados').where('status','==','aprovado').onSnapshot(
      snap => recebe(snap.docs.map(d => Object.assign({id:d.id}, d.data()))),
      err => { console.error('Telão:', err); $('#palco').innerHTML = '<div class="vazio">Não consegui carregar as frases.</div>'; });
  } else {
    const ex = [
      ['Ana','Cidade 1',0,'Na ECIT eu quero…','fazer novos amigos e aprender tecnologia.'],
      ['Pedro','Cidade 2',6,'Meu maior sonho é…','ser jogador de futsal e também engenheiro.'],
      ['Júlia','Cidade 1',3,'O que mais me dá curiosidade é…','como funcionam os laboratórios.'],
      ['Davi','Cidade 3',7,'Eu espero conseguir…','passar no vestibular e ajudar minha família.'],
      ['Marina','Cidade 1',1,'Na ECIT eu quero…','participar de todos os projetos da escola.'],
      ['Lucas','Cidade 2',4,'Meu maior sonho é…','criar um aplicativo que ajude minha cidade.'],
    ].map((x,i) => ({id:'ex'+i, nome:x[0], cidade:x[1], avatar:x[2], inicio:x[3], texto:x[4], criadoEm:i}));
    recebe(ex);
  }
  T.timer = setInterval(proxima, SEGUNDOS_POR_FRASE * 1000);
}
iniciar();

/* QR code (precisa de internet para carregar a biblioteca; sem ela mostra o endereço escrito) */
(function(){
  const box = $('#qr');
  if(typeof QRCode !== 'undefined'){ try{ new QRCode(box, {text: LINK_PARTICIPAR, width: 220, height: 220, correctLevel: QRCode.CorrectLevel.M}); return; }catch(e){} }
  box.textContent = LINK_PARTICIPAR;
})();

function telaCheia(){ const d = document.documentElement; if(!document.fullscreenElement && d.requestFullscreen) d.requestFullscreen(); else if(document.exitFullscreen) document.exitFullscreen(); }
$('#fs').addEventListener('click', telaCheia);
document.addEventListener('keydown', e => { if(e.key === 'f' || e.key === 'F') telaCheia(); });
document.addEventListener('fullscreenchange', () => { $('#fs').style.display = document.fullscreenElement ? 'none' : ''; });
</script>
